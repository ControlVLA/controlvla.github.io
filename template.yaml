  - title: Method
    text: |
      <div className="uk-responsive-width">
        <img src="pipeline.png" alt="Method" />
      </div>

      Given a pre-trained general-purpose VLA model, our goal is to efficiently adapt it into a task-specific expert policy using limited demonstrations. To this end, we propose <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span>, which employs a ControlNet-style fine-tuning that integrates object-centric representations with a pre-trained VLA model. We first pre-train the general-purpose VLA model on a large-scale, multi-task manipulation dataset, then extract object-centric features to focus learning on task-relevant elements, and finally fine-tune the expert policy by gradually incorporating these features with ControlNet-style fine-tuning strategy. The zero-initialized weights and biases preserve the rich prior knowledge of the pre-trained policy while progressively grounding it in object-centric representation.

  - title: Evaluation Setup
    text: |
      To evaluate the efficiency of <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span>,, we conduct **8** various real-world tasks using **only 10-20 demonstrations**.
      <div className="uk-responsive-width" style="margin-top: -20px;">npm 
        <img src="task_illustration.png"/>
      </div>

  - title: Long-horizon Performance
    text: |
      <div style="width: 100%; margin-left: auto; margin-right: auto;">
        <b>Performance on Long-horizon Tasks.</b> <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span> significantly outperforms baselines under this low-data regime, achieving an average 60.0% success rate on two long-horizon tasks. The stage-wise breakdown further demonstrates <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span>'s consistent performance throughout long sequences.
      </div>
      <div style="margin-top: 10px; width: 80%; margin-left: auto; margin-right: auto;">
        <img src="res_long.jpg" style="width: 100%;"/>
      </div>

  - title: Adapt ControlVLA to π₀
    text: |
      We further adapt and evaluate <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span> on $\pi_0$, a more general VLA model, referred to as <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span> @ $\pi_0$. The $\pi_0$ model leverages a pre-trained vision-language backbone and introduces a separate <i>action expert</i> that outputs continuous actions using flow matching. <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span> @ $\pi_0$ extends this architecture by incorporating an additional <i>object expert</i> and a set of zero-convolution layers to progressively inject object-centric representation guidance.

      Our adaptation method <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span> @ $\pi_0$ consistently outperforms the fine-tuned $\pi_0$, demonstrating that <span style='font-family: \"Times New Roman\", Times, serif; font-variant: small-caps; font-weight: bold; font-size: 1.0em;'>ControlVLA</span> can serve as a plug-in module to enhance performance across a wide range of pre-trained VLA models.
      <div style="margin-top: -10px; width: 80%; margin-left: auto; margin-right: auto;">
        <img src="res_pi0.jpg" style="width: 100%;"/>
      </div>

